<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Bet Slip Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #dbe4eb;
        color: #1a202c;
        min-height: 100vh;
        padding: 28px 16px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 32px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================
       BUILDER CONTROL PANEL
       ========================================= */
    .control-panel {
        background: #ffffff;
        border-radius: 20px;
        padding: 22px;
        width: 435px;
        min-width: 435px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-height: 94vh;
        overflow-y: auto;
    }

    .panel-top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .panel-top-bar h2 {
        font-size: 1.08rem;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.2px;
    }

    .btn-reset {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 0.74rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s;
    }

    .btn-reset:hover {
        background: #e2e8f0;
        color: #0f172a;
    }

    .form-group {
        margin-bottom: 11px;
    }

    .form-row {
        display: flex;
        gap: 8px;
    }

    .form-row .form-group {
        flex: 1;
    }

    label {
        display: block;
        font-size: 0.69rem;
        font-weight: 700;
        color: #64748b;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    input[type="text"], input[type="number"], select {
        width: 100%;
        padding: 8px 10px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        color: #0f172a;
        border-radius: 9px;
        font-size: 0.84rem;
        font-weight: 600;
        font-family: inherit;
        outline: none;
        transition: 0.18s;
    }

    input::placeholder {
        color: #94a3b8;
        font-weight: 500;
    }

    input:focus, select:focus {
        border-color: #208633;
        background: #ffffff;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        font-weight: 700;
        color: #334155;
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
        margin-bottom: 0;
    }

    .toggles-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        padding: 10px 12px;
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* Picks Editor */
    .picks-editor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 12px 0 8px 0;
    }

    .picks-editor-header span {
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        color: #0f172a;
        letter-spacing: 0.4px;
    }

    .pick-editor-card {
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        position: relative;
    }

    .pick-editor-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 9px;
    }

    .pick-editor-badge {
        font-size: 0.73rem;
        font-weight: 800;
        color: #208633;
        background: #dcfce7;
        padding: 3px 8px;
        border-radius: 6px;
    }

    .pick-editor-actions {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .btn-mini {
        background: #e2e8f0;
        color: #334155;
        border: none;
        border-radius: 6px;
        padding: 3px 7px;
        font-size: 0.70rem;
        font-weight: 700;
        cursor: pointer;
    }

    .btn-mini:hover {
        background: #cbd5e1;
    }

    .btn-remove-pick {
        background: #fee2e2;
        color: #dc2626;
        border: none;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 0.71rem;
        font-weight: 800;
        cursor: pointer;
    }

    .btn-remove-pick:hover {
        background: #fecaca;
    }

    .date-input-wrap {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    .btn-now {
        background: #e2e8f0;
        color: #334155;
        border: none;
        border-radius: 8px;
        height: 35px;
        padding: 0 9px;
        font-size: 0.70rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.15s;
    }

    .btn-now:hover {
        background: #cbd5e1;
        color: #0f172a;
    }

    .btn-add-pick {
        width: 100%;
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px dashed #93c5fd;
        border-radius: 10px;
        padding: 9px;
        font-size: 0.82rem;
        font-weight: 800;
        cursor: pointer;
        margin-bottom: 12px;
        transition: 0.15s;
    }

    .btn-add-pick:hover {
        background: #dbeafe;
    }

    .btn-main {
        background: #208633;
        color: #ffffff;
        border: none;
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        font-size: 0.94rem;
        font-weight: 800;
        cursor: pointer;
        margin-top: 4px;
        transition: 0.2s;
        box-shadow: 0 4px 12px rgba(32, 134, 51, 0.25);
    }

    .btn-main:hover {
        background: #196b28;
    }

    /* =========================================================
       LIVE BET SLIP PREVIEW (512px -> @2x = 1024px)
       ========================================================= */
    .preview-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: sticky;
        top: 28px;
    }

    .preview-caption {
        font-size: 0.75rem;
        font-weight: 700;
        color: #475569;
    }

    .slip-stage {
        width: 512px;
        min-width: 512px;
        background-color: #f4f4f4;
        padding: 0 10px 0 10px;
        position: relative;
        overflow: hidden;
        user-select: none;
        font-family: 'Roboto Condensed', 'Roboto', -apple-system, sans-serif;
    }

    .slip-stage.top-gap-mode {
        padding-top: 2px;
    }

    .slip-stage.full-card-mode {
        padding: 10px;
    }

    .bwin-card {
        width: 100%;
        background-color: #ffffff;
        border-left: 1px solid #d5d5d5;
        border-right: 1px solid #d5d5d5;
        border-top: 1px solid #d9d9d9;
        border-top-left-radius: 6px;
        border-top-right-radius: 6px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.12);
        position: relative;
        padding-bottom: 2px;
    }

    .slip-stage.crop-top-edge .bwin-card {
        border-top: none;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
    }

    .slip-stage.full-card-mode .bwin-card {
        border-bottom: 1px solid #d5d5d5;
        border-radius: 6px;
        padding-bottom: 0;
    }

    /* Header: ⌄ MULTI BET 2 picks   [Won] */
    .card-header {
        height: 56.5px;
        padding: 10.5px 15px 20px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #eaeaea;
        background: #ffffff;
    }

    .header-left {
        display: flex;
        align-items: center;
        height: 26px;
    }

    .chevron-wrap {
        width: 15.5px;
        height: 15.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 7.5px;
        flex-shrink: 0;
    }

    .chevron-wrap svg {
        width: 15.5px;
        height: 8.5px;
        display: block;
    }

    .header-title-group {
        display: flex;
        align-items: baseline;
        gap: 5.5px;
        line-height: 1;
    }

    .header-bet-type {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 18.2px;
        font-weight: 700;
        color: #2b2b2b;
        letter-spacing: -0.15px;
        text-transform: uppercase;
    }

    .header-picks-count {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 18.2px;
        font-weight: 400;
        color: #2b2b2b;
        letter-spacing: -0.1px;
    }

    .header-status-pill {
        height: 26px;
        min-width: 37.5px;
        padding: 0 5.8px;
        border-radius: 4.5px;
        background-color: #208633;
        color: #ffffff;
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 15.4px;
        font-weight: 700;
        letter-spacing: 0px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .header-status-pill.status-lost {
        background-color: #c92a2a;
    }

    .header-status-pill.status-open {
        background-color: #e9ecef;
        color: #495057;
    }

    .header-status-pill.status-cashout {
        background-color: #0ca678;
    }

    /* Picks List */
    .picks-list {
        background: #ffffff;
    }

    .pick-row {
        position: relative;
        display: flex;
        align-items: flex-start;
        padding: 12px 15.5px 0 15px;
    }

    .pick-timeline-col {
        width: 23px;
        align-self: stretch;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        position: relative;
    }

    .pick-status-dot {
        width: 14.5px;
        height: 14.5px;
        border-radius: 50%;
        background-color: #2fb348;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5px;
        position: relative;
        z-index: 2;
    }

    .pick-status-dot svg {
        width: 14.5px;
        height: 14.5px;
        display: block;
    }

    .pick-status-dot.dot-open {
        background-color: #ffffff;
        border: 1.6px solid #b8b8b8;
    }

    .pick-status-dot.dot-lost {
        background-color: #e03131;
    }

    .pick-status-dot.dot-void {
        background-color: #868e96;
    }

    .pick-connector-line {
        position: absolute;
        left: 6.1px;
        top: 22px;
        bottom: -7px;
        width: 2.3px;
        background-color: #d4d4d4;
        z-index: 1;
    }

    .pick-body-col {
        flex: 1;
        min-width: 0;
        padding-bottom: 11.5px;
        border-bottom: 1px solid #d6d6d6;
    }

    .pick-row.is-last-pick .pick-body-col {
        border-bottom: none;
    }

    .pick-row.is-last-pick {
        border-bottom: 1px solid #e9e9e9;
    }

    /* Row 1: Selection + Market + EP + Odds */
    .pick-main-line {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        line-height: 1.06;
    }

    .pick-title-wrap {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        column-gap: 7px;
        row-gap: 2px;
        min-width: 0;
    }

    .pick-selection-name {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 19.7px;
        font-weight: 700;
        color: #2b2b2b;
        letter-spacing: -0.1px;
    }

    .pick-market-name {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 19px;
        font-weight: 400;
        color: #6a6a6a;
        letter-spacing: -0.05px;
    }

    .pick-ep-badge {
        font-family: 'Roboto', sans-serif;
        font-size: 16.8px;
        font-weight: 700;
        color: #2b2b2b;
        letter-spacing: 0.1px;
        margin-left: 4.5px;
    }

    .pick-odds-val {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 18.8px;
        font-weight: 400;
        color: #2b2b2b;
        letter-spacing: 0px;
        flex-shrink: 0;
    }

    /* Row 2: Result: Won */
    .pick-result-line {
        margin-top: 4px;
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 18.4px;
        font-weight: 400;
        line-height: 1.08;
        display: flex;
        align-items: baseline;
        gap: 5px;
    }

    .pick-result-label {
        color: #6a6a6a;
    }

    .pick-result-val {
        color: #2b2b2b;
    }

    /* Row 3: Home Team - Away Team */
    .pick-fixture-line {
        margin-top: 11.5px;
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 18.4px;
        font-weight: 400;
        color: #2b2b2b;
        line-height: 1.08;
        letter-spacing: -0.05px;
    }

    /* Row 4: Date & Time */
    .pick-date-line {
        margin-top: 4px;
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 15.5px;
        font-weight: 400;
        color: #6a6a6a;
        line-height: 1.08;
        letter-spacing: 0px;
    }

    /* Placeholder look on preview when field is empty */
    .is-placeholder {
        opacity: 0.28;
    }

    /* Optional Footer Summary */
    .card-footer-summary {
        padding: 13px 16px 15px 16px;
        background: #ffffff;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .footer-col {
        display: flex;
        flex-direction: column;
        gap: 3px;
    }

    .footer-col.right {
        align-items: flex-end;
    }

    .footer-lbl {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 15px;
        font-weight: 400;
        color: #6a6a6a;
    }

    .footer-val {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 19.5px;
        font-weight: 700;
        color: #2b2b2b;
    }

    .footer-val.won-green {
        color: #208633;
    }

    .blurred-el {
        filter: blur(5px);
    }

    @media (max-width: 980px) {
        body {
            flex-direction: column;
            align-items: center;
        }
        .control-panel {
            width: 100%;
            max-width: 512px;
            min-width: 0;
            max-height: none;
        }
        .preview-column {
            position: static;
        }
    }
</style>
</head>
<body>

<datalist id="market-suggestions">
    <option value="2up - Instant Win"></option>
    <option value="Match Result"></option>
    <option value="Over 2.5 Goals"></option>
    <option value="Over 1.5 Goals"></option>
    <option value="Both Teams to Score"></option>
    <option value="Double Chance"></option>
    <option value="Draw No Bet"></option>
</datalist>

<!-- CONTROL PANEL -->
<div class="control-panel">
    <div class="panel-top-bar">
        <h2>Multi Bet Slip Builder</h2>
        <button type="button" class="btn-reset" onclick="resetBuilder()">Reset All</button>
    </div>

    <!-- Card Layout & Resolution -->
    <div class="form-row">
        <div class="form-group">
            <label>Card Style</label>
            <select id="selectFrameMode" onchange="handleFrameModeChange(); renderSlip()">
                <option value="screen_crop" selected>Compact Card (Cropped Bottom)</option>
                <option value="screen_top_shadow">Compact Card (With Top Border)</option>
                <option value="full_card">Full Card (With Stake &amp; Payout)</option>
            </select>
        </div>
        <div class="form-group" style="max-width: 138px;">
            <label>PNG Resolution</label>
            <select id="selectExportScale" onchange="renderSlip()">
                <option value="2" selected>1024px (2x)</option>
                <option value="2.5">1280px (HD)</option>
                <option value="3">1536px (Ultra)</option>
            </select>
        </div>
    </div>

    <!-- Header Settings -->
    <div class="form-row">
        <div class="form-group">
            <label>Bet Title</label>
            <input type="text" id="inputBetType" value="MULTI BET" placeholder="MULTI BET" oninput="renderSlip()">
        </div>
        <div class="form-group">
            <label>Picks Label (Blank = Auto)</label>
            <input type="text" id="inputPicksCount" placeholder="Auto (e.g. 2 picks)" oninput="renderSlip()">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Slip Status</label>
            <select id="selectHeaderStatus" onchange="handleStatusChange(); renderSlip()">
                <option value="won" selected>Won (Green)</option>
                <option value="open">Open (Pending)</option>
                <option value="lost">Lost (Red)</option>
                <option value="cashout">Cashed Out</option>
                <option value="hidden">Hidden Badge</option>
            </select>
        </div>
        <div class="form-group" style="max-width: 145px;">
            <label>Badge Text</label>
            <input type="text" id="inputHeaderBadgeText" value="Won" placeholder="Won" oninput="renderSlip()">
        </div>
    </div>

    <!-- Toggles -->
    <div class="toggles-box">
        <label class="checkbox-label">
            <input type="checkbox" id="checkShowChevron" checked onchange="renderSlip()">
            Show left chevron arrow (⌄)
        </label>
        <label class="checkbox-label">
            <input type="checkbox" id="checkBlurPicks" onchange="renderSlip()">
            Blur selections &amp; markets
        </label>
    </div>

    <!-- Dynamic Picks List -->
    <div class="picks-editor-header">
        <span>Selections (Picks)</span>
    </div>

    <div id="picks-editor-list"></div>

    <button type="button" class="btn-add-pick" onclick="addPick()">+ Add Pick</button>

    <!-- Optional Footer Finance Inputs -->
    <div id="footerFinanceInputs" style="display: none; border-top: 1px solid #e2e8f0; padding-top: 12px; margin-bottom: 8px;">
        <div class="form-row">
            <div class="form-group">
                <label>Stake</label>
                <input type="text" id="inputStake" value="$100.00" placeholder="$100.00" oninput="recalcPayout(); renderSlip()">
            </div>
            <div class="form-group">
                <label>Total Payout</label>
                <input type="text" id="inputPayout" value="$225.00" placeholder="$225.00" oninput="renderSlip()">
            </div>
        </div>
    </div>

    <button type="button" class="btn-main" onclick="downloadImage()">Download Slip (PNG)</button>
</div>

<!-- LIVE SLIP PREVIEW -->
<div class="preview-column">
    <div class="slip-stage crop-top-edge" id="capture-slip">
        <div class="bwin-card">
            <!-- Header -->
            <div class="card-header">
                <div class="header-left">
                    <div class="chevron-wrap" id="disp-chevron">
                        <svg viewBox="0 0 20 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1.8 1.8L10 9.8L18.2 1.8" stroke="#303030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="header-title-group">
                        <span class="header-bet-type" id="disp-bet-type">MULTI BET</span>
                        <span class="header-picks-count" id="disp-picks-count">2 picks</span>
                    </div>
                </div>

                <div class="header-status-pill" id="disp-header-pill">Won</div>
            </div>

            <!-- Picks -->
            <div class="picks-list" id="disp-picks-list"></div>

            <!-- Optional Footer -->
            <div class="card-footer-summary" id="disp-card-footer" style="display: none;">
                <div class="footer-col">
                    <span class="footer-lbl">Stake</span>
                    <span class="footer-val" id="disp-stake">$100.00</span>
                </div>
                <div class="footer-col right">
                    <span class="footer-lbl" id="disp-payout-lbl">Total Winnings</span>
                    <span class="footer-val won-green" id="disp-payout">$225.00</span>
                </div>
            </div>
        </div>
    </div>
    <div class="preview-caption" id="disp-dimensions-info">Output size: 1024 × 603 px</div>
</div>

<script>
    function createEmptyPick() {
        const currentHeaderStatus = document.getElementById('selectHeaderStatus')
            ? document.getElementById('selectHeaderStatus').value
            : 'won';
        const isOpen = currentHeaderStatus === 'open';
        return {
            dotStatus: isOpen ? 'open' : 'won',
            selection: '',
            market: '2up - Instant Win',
            epText: 'EP',
            odds: '',
            resultLabel: 'Result:',
            resultValue: isOpen ? '' : 'Won',
            fixture: '',
            date: ''
        };
    }

    let picksState = [
        {
            dotStatus: 'won',
            selection: '',
            market: '2up - Instant Win',
            epText: 'EP',
            odds: '',
            resultLabel: 'Result:',
            resultValue: 'Won',
            fixture: '',
            date: ''
        },
        {
            dotStatus: 'won',
            selection: '',
            market: '2up - Instant Win',
            epText: 'EP',
            odds: '',
            resultLabel: 'Result:',
            resultValue: 'Won',
            fixture: '',
            date: ''
        }
    ];

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatNowUsDate() {
        const d = new Date();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const yy = String(d.getFullYear()).slice(-2);
        let hours = d.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        if (hours === 0) hours = 12;
        const mins = String(d.getMinutes()).padStart(2, '0');
        return `${mm}/${dd}/${yy} ${hours}:${mins} ${ampm}`;
    }

    function getDotSvg(status) {
        if (status === 'won') {
            return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7.3 12.3L10.4 15.4L16.8 8.9" stroke="#ffffff" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
        }
        if (status === 'lost') {
            return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 8L16 16M16 8L8 16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
            </svg>`;
        }
        if (status === 'void') {
            return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 12H17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>`;
        }
        return '';
    }

    function renderPicksEditor() {
        const container = document.getElementById('picks-editor-list');
        container.innerHTML = picksState.map((p, idx) => `
            <div class="pick-editor-card">
                <div class="pick-editor-top">
                    <span class="pick-editor-badge">Pick #${idx + 1}</span>
                    <div class="pick-editor-actions">
                        ${idx > 0 ? `<button type="button" class="btn-mini" title="Move Up" onclick="movePick(${idx}, -1)">↑</button>` : ''}
                        ${idx < picksState.length - 1 ? `<button type="button" class="btn-mini" title="Move Down" onclick="movePick(${idx}, 1)">↓</button>` : ''}
                        ${picksState.length > 1 ? `<button type="button" class="btn-remove-pick" onclick="removePick(${idx})">✕ Remove</button>` : ''}
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Selection (Bold)</label>
                        <input type="text" value="${escapeHtml(p.selection)}" placeholder="e.g. Arsenal FC" oninput="updatePickField(${idx}, 'selection', this.value)">
                    </div>
                    <div class="form-group" style="max-width: 98px;">
                        <label>Odds</label>
                        <input type="text" value="${escapeHtml(p.odds)}" placeholder="1.50" oninput="updatePickField(${idx}, 'odds', this.value)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Market</label>
                        <input type="text" list="market-suggestions" value="${escapeHtml(p.market)}" placeholder="2up - Instant Win" oninput="updatePickField(${idx}, 'market', this.value)">
                    </div>
                    <div class="form-group" style="max-width: 82px;">
                        <label>Tag (EP)</label>
                        <input type="text" value="${escapeHtml(p.epText)}" placeholder="EP" oninput="updatePickField(${idx}, 'epText', this.value)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Match (Home - Away)</label>
                        <input type="text" value="${escapeHtml(p.fixture)}" placeholder="Home Team - Away Team" oninput="updatePickField(${idx}, 'fixture', this.value)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Date &amp; Time</label>
                        <div class="date-input-wrap">
                            <input type="text" id="pick-date-${idx}" value="${escapeHtml(p.date)}" placeholder="11/26/26 3:00 PM" oninput="updatePickField(${idx}, 'date', this.value)">
                            <button type="button" class="btn-now" title="Fill current date & time" onclick="fillNowDate(${idx})">Now</button>
                        </div>
                    </div>
                    <div class="form-group" style="max-width: 88px;">
                        <label>Icon</label>
                        <select onchange="updatePickField(${idx}, 'dotStatus', this.value)">
                            <option value="won" ${p.dotStatus === 'won' ? 'selected' : ''}>✔ Won</option>
                            <option value="open" ${p.dotStatus === 'open' ? 'selected' : ''}>○ Open</option>
                            <option value="lost" ${p.dotStatus === 'lost' ? 'selected' : ''}>✕ Lost</option>
                            <option value="void" ${p.dotStatus === 'void' ? 'selected' : ''}>— Void</option>
                        </select>
                    </div>
                    <div class="form-group" style="max-width: 76px;">
                        <label>Result</label>
                        <input type="text" value="${escapeHtml(p.resultValue)}" placeholder="None" oninput="updatePickField(${idx}, 'resultValue', this.value)">
                    </div>
                </div>
            </div>
        `).join('');
    }

    function updatePickField(idx, field, val) {
        picksState[idx][field] = val;
        if (field === 'odds') recalcPayout();
        renderSlip();
    }

    function fillNowDate(idx) {
        const formatted = formatNowUsDate();
        picksState[idx].date = formatted;
        const inputEl = document.getElementById(`pick-date-${idx}`);
        if (inputEl) inputEl.value = formatted;
        renderSlip();
    }

    function addPick() {
        picksState.push(createEmptyPick());
        renderPicksEditor();
        recalcPayout();
        renderSlip();
    }

    function removePick(idx) {
        if (picksState.length <= 1) return;
        picksState.splice(idx, 1);
        renderPicksEditor();
        recalcPayout();
        renderSlip();
    }

    function movePick(idx, dir) {
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= picksState.length) return;
        const temp = picksState[idx];
        picksState[idx] = picksState[targetIdx];
        picksState[targetIdx] = temp;
        renderPicksEditor();
        renderSlip();
    }

    function resetBuilder() {
        document.getElementById('selectFrameMode').value = 'screen_crop';
        document.getElementById('selectExportScale').value = '2';
        document.getElementById('inputBetType').value = 'MULTI BET';
        document.getElementById('inputPicksCount').value = '';
        document.getElementById('selectHeaderStatus').value = 'won';
        document.getElementById('inputHeaderBadgeText').value = 'Won';
        document.getElementById('checkShowChevron').checked = true;
        document.getElementById('checkBlurPicks').checked = false;

        picksState = [createEmptyPick(), createEmptyPick()];
        handleFrameModeChange();
        renderPicksEditor();
        recalcPayout();
        renderSlip();
    }

    function handleStatusChange() {
        const st = document.getElementById('selectHeaderStatus').value;
        const badgeInput = document.getElementById('inputHeaderBadgeText');
        if (st === 'won') {
            badgeInput.value = 'Won';
            picksState.forEach(p => { p.dotStatus = 'won'; p.resultValue = 'Won'; });
        } else if (st === 'lost') {
            badgeInput.value = 'Lost';
            picksState.forEach((p, i) => {
                if (i === picksState.length - 1) { p.dotStatus = 'lost'; p.resultValue = 'Lost'; }
            });
        } else if (st === 'open') {
            badgeInput.value = 'Open';
            picksState.forEach(p => { p.dotStatus = 'open'; p.resultValue = ''; });
        } else if (st === 'cashout') {
            badgeInput.value = 'Cashed Out';
        }
        renderPicksEditor();
    }

    function handleFrameModeChange() {
        const fm = document.getElementById('selectFrameMode').value;
        document.getElementById('footerFinanceInputs').style.display = (fm === 'full_card') ? 'block' : 'none';
    }

    function recalcPayout() {
        const rawStake = document.getElementById('inputStake').value;
        const matchNum = rawStake.match(/[\d.,]+/);
        if (!matchNum) return;
        const prefix = rawStake.slice(0, matchNum.index);
        const suffix = rawStake.slice(matchNum.index + matchNum[0].length);
        const stakeVal = parseFloat(matchNum[0].replace(/,/g, '')) || 0;
        const totalOdds = picksState.reduce((acc, p) => acc * (parseFloat(p.odds) || 1), 1);
        const payout = (stakeVal * totalOdds).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('inputPayout').value = `${prefix}${payout}${suffix}`;
    }

    function renderSlip(forExport = false) {
        const stage = document.getElementById('capture-slip');
        const frameMode = document.getElementById('selectFrameMode').value;
        const betType = document.getElementById('inputBetType').value;
        const customCount = document.getElementById('inputPicksCount').value.trim();
        const headerStatus = document.getElementById('selectHeaderStatus').value;
        const badgeText = document.getElementById('inputHeaderBadgeText').value;
        const showChevron = document.getElementById('checkShowChevron').checked;
        const blurPicks = document.getElementById('checkBlurPicks').checked;

        stage.className = 'slip-stage';
        if (frameMode === 'screen_crop') {
            stage.classList.add('crop-top-edge');
        } else if (frameMode === 'screen_top_shadow') {
            stage.classList.add('top-gap-mode');
        } else if (frameMode === 'full_card') {
            stage.classList.add('full-card-mode');
        }

        document.getElementById('disp-chevron').style.display = showChevron ? 'flex' : 'none';
        document.getElementById('disp-bet-type').innerText = betType;
        const autoCountText = picksState.length === 1 ? '1 pick' : `${picksState.length} picks`;
        document.getElementById('disp-picks-count').innerText = customCount !== '' ? customCount : autoCountText;

        const pillEl = document.getElementById('disp-header-pill');
        if (headerStatus === 'hidden' || !badgeText.trim()) {
            pillEl.style.display = 'none';
        } else {
            pillEl.style.display = 'inline-flex';
            pillEl.innerText = badgeText;
            pillEl.className = 'header-status-pill';
            if (headerStatus === 'lost') pillEl.classList.add('status-lost');
            else if (headerStatus === 'open') pillEl.classList.add('status-open');
            else if (headerStatus === 'cashout') pillEl.classList.add('status-cashout');
        }

        const listEl = document.getElementById('disp-picks-list');
        listEl.innerHTML = picksState.map((p, idx) => {
            const isLast = (idx === picksState.length - 1);
            const dotClass = p.dotStatus === 'open' ? 'dot-open'
                : p.dotStatus === 'lost' ? 'dot-lost'
                : p.dotStatus === 'void' ? 'dot-void' : '';

            const hasSelection = String(p.selection || '').trim().length > 0;
            const hasOdds = String(p.odds || '').trim().length > 0;
            const hasFixture = String(p.fixture || '').trim().length > 0;
            const hasDate = String(p.date || '').trim().length > 0;
            const hasEp = String(p.epText || '').trim().length > 0;
            const hasResult = String(p.resultValue || '').trim().length > 0;

            const dispSelection = hasSelection ? p.selection : (forExport ? '' : `Selection #${idx + 1}`);
            const dispOdds = hasOdds ? p.odds : (forExport ? '' : '1.50');
            const dispFixture = hasFixture ? p.fixture : (forExport ? '' : 'Home Team - Away Team');
            const dispDate = hasDate ? p.date : (forExport ? '' : 'MM/DD/YY 3:00 PM');

            return `
                <div class="pick-row ${isLast ? 'is-last-pick' : ''}">
                    <div class="pick-timeline-col">
                        <div class="pick-status-dot ${dotClass}">
                            ${getDotSvg(p.dotStatus)}
                        </div>
                        ${!isLast ? '<div class="pick-connector-line"></div>' : ''}
                    </div>

                    <div class="pick-body-col">
                        <div class="pick-main-line">
                            <div class="pick-title-wrap">
                                <span class="pick-selection-name ${blurPicks ? 'blurred-el' : ''} ${!hasSelection && !forExport ? 'is-placeholder' : ''}">${escapeHtml(dispSelection)}</span>
                                ${p.market ? `<span class="pick-market-name ${blurPicks ? 'blurred-el' : ''}">${escapeHtml(p.market)}</span>` : ''}
                                ${hasEp ? `<span class="pick-ep-badge">${escapeHtml(p.epText)}</span>` : ''}
                            </div>
                            <span class="pick-odds-val ${!hasOdds && !forExport ? 'is-placeholder' : ''}">${escapeHtml(dispOdds)}</span>
                        </div>

                        ${hasResult ? `
                        <div class="pick-result-line">
                            <span class="pick-result-label">${escapeHtml(p.resultLabel || 'Result:')}</span>
                            <span class="pick-result-val">${escapeHtml(p.resultValue)}</span>
                        </div>
                        ` : ''}

                        <div class="pick-fixture-line ${!hasFixture && !forExport ? 'is-placeholder' : ''}">${escapeHtml(dispFixture)}</div>
                        <div class="pick-date-line ${!hasDate && !forExport ? 'is-placeholder' : ''}">${escapeHtml(dispDate)}</div>
                    </div>
                </div>
            `;
        }).join('');

        const footerEl = document.getElementById('disp-card-footer');
        if (frameMode === 'full_card') {
            footerEl.style.display = 'flex';
            document.getElementById('disp-stake').innerText = document.getElementById('inputStake').value;
            document.getElementById('disp-payout').innerText = document.getElementById('inputPayout').value;
            document.getElementById('disp-payout-lbl').innerText = (headerStatus === 'open') ? 'Possible Winnings' : 'Total Winnings';
        } else {
            footerEl.style.display = 'none';
        }

        requestAnimationFrame(() => {
            const scale = parseFloat(document.getElementById('selectExportScale').value) || 2;
            const w = Math.round(stage.offsetWidth * scale);
            const h = Math.round(stage.offsetHeight * scale);
            document.getElementById('disp-dimensions-info').innerText = `Output size: ${w} × ${h} px`;
        });
    }

    async function downloadImage() {
        const target = document.getElementById('capture-slip');
        const scale = parseFloat(document.getElementById('selectExportScale').value) || 2;
        const firstTeam = (picksState[0]?.selection || 'Slip').trim().replace(/[^A-Za-z0-9]+/g, '_') || 'Slip';
        const fileName = `MultiBet_${firstTeam}.png`;

        renderSlip(true);
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
        }

        try {
            if (window.htmlToImage && typeof window.htmlToImage.toPng === 'function') {
                const dataUrl = await window.htmlToImage.toPng(target, {
                    pixelRatio: scale,
                    cacheBust: true
                });
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                link.click();
                renderSlip(false);
                return;
            }
        } catch (err) {
            console.warn('html-to-image fallback to html2canvas:', err);
        }

        const originalScroll = window.scrollY;
        window.scrollTo(0, 0);
        html2canvas(target, {
            scale: scale,
            useCORS: true,
            backgroundColor: null
        }).then(canvas => {
            window.scrollTo(0, originalScroll);
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
            renderSlip(false);
        });
    }

    // Initialize blank builder
    renderPicksEditor();
    renderSlip();
</script>
</body>
</html>
